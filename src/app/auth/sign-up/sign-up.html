<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-5 col-md-7 col-sm-10">
      <div class="card shadow rounded-4">
        <div class="card-body p-4">
          <h3 class="text-center mb-4">Sign Up</h3>

          <div class="mb-3">
            <label class="form-label fs-6">Full Name</label>
            <input
              type="text"
              class="form-control form-control-lg"
              placeholder="John Michael"
              #fullName
            />
          </div>

          <div class="mb-3">
            <label class="form-label fs-6">Email</label>
            <input
              type="email"
              class="form-control form-control-lg"
              placeholder="johnmichael@gmail.com"
              #email
            />
          </div>

          <div class="mb-3">
            <label class="form-label fs-6">Password</label>
            <input
              type="password"
              class="form-control form-control-lg"
              placeholder="Enter password"
              #password
            />
          </div>

          <div class="mb-4">
            <label class="form-label fs-6">Confirm Password</label>
            <input
              type="password"
              class="form-control form-control-lg"
              placeholder="Confirm password"
              #confirmPassword
            />
          </div>

          <button
            class="btn btn-primary btn-lg w-100"
            (click)="submit(
              fullName.value,
              email.value,
              password.value,
              confirmPassword.value
            )"
          >
            Sign Up
          </button>

          <p class="text-center mt-3 fs-6">
            Already have an account?
            <a routerLink="/signin">Sign In</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
