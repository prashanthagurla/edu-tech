<div class="container d-flex justify-content-center align-items-center py-4">
  <div class="card shadow rounded-4 signup-card">
    <div class="card-body p-4">
      <!-- Title -->
      <h3 class="text-center mb-3 fw-bold text-primary">Create Account</h3>

      <form [formGroup]="signupForm" (ngSubmit)="onSubmit()">
        <!-- Full Name -->
        <div class="mb-3">
          <label class="form-label">Full Name</label>
          <input
            type="text"
            class="form-control form-control-lg"
            placeholder="John Michael"
            formControlName="fullName"
          />
          <small *ngIf="f['fullName'].touched && f['fullName'].invalid" class="text-danger">
            Full name is required
          </small>
        </div>

        <!-- Email -->
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input
            type="email"
            class="form-control form-control-lg"
            placeholder="john@gmail.com"
            formControlName="email"
          />
          <small *ngIf="f['email'].touched && f['email'].errors?.['required']" class="text-danger">
            Email is required
          </small>
          <small *ngIf="f['email'].touched && f['email'].errors?.['email']" class="text-danger">
            Enter a valid email
          </small>
        </div>

        <!-- Password -->
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input
            type="password"
            class="form-control form-control-lg"
            placeholder="Enter password"
            formControlName="password"
          />
          <small *ngIf="f['password'].touched && f['password'].invalid" class="text-danger">
            Password is required
          </small>
        </div>

        <!-- Confirm Password -->
        <div class="mb-3">
          <label class="form-label">Confirm Password</label>
          <input
            type="password"
            class="form-control form-control-lg"
            placeholder="Confirm password"
            formControlName="confirmPassword"
          />
          <small
            *ngIf="f['confirmPassword'].touched && f['confirmPassword'].invalid"
            class="text-danger"
          >
            Confirm password is required
          </small>
        </div>

        <!-- State -->
        <ng-container *ngIf="state$ | async as state">
          <div *ngIf="state.error" class="alert alert-danger py-2">
            {{ state.error }}
          </div>
          <div *ngIf="state.success" class="alert alert-success py-2">
            Signup successful! Redirecting...
          </div>
        </ng-container>

        <!-- Button -->
        <button
          type="submit"
          class="btn btn-primary btn-lg w-100"
          [disabled]="signupForm.invalid || (state$ | async)?.loading"
        >
          {{ (state$ | async)?.loading ? 'Signing Up...' : 'Sign Up' }}
        </button>
      </form>

      <!-- Login Link -->
      <p class="text-center mt-3">
        Already have an account?
        <a routerLink="/login-page" class="fw-semibold">Login</a>
      </p>
    </div>
  </div>
</div>
