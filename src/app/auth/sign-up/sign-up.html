<div class="signup-background">
  <p-toast position="top-right"></p-toast>

  <div class="signUp-container">
    <mat-card class="signup-card">
      <h1 class="title">sign up</h1>
      <form [formGroup]="signupForm" (ngSubmit)="onSubmit()">
        <!-- fullName -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Full Name</mat-label>
          <input matInput formControlName="fullName" />
        </mat-form-field>
        <!-- email -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input matInput formControlName="email" />
          <mat-icon matPrefix>email</mat-icon>
          <mat-error
            *ngIf="signupForm.controls['email'].touched && signupForm.controls['email'].invalid"
          >
            Invalid Email
          </mat-error>
        </mat-form-field>
        <!-- Roll Number -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Roll Number</mat-label>
          <input matInput formControlName="rollNumber" />
        </mat-form-field>

        <!-- password  -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Password</mat-label>
          <input
            matInput
            formControlName="password"
            autocomplete="new-password"
            [type]="hidePassword ? 'password' : 'text'"
          />
          <mat-icon matPrefix>lock</mat-icon>

          <button matSuffix type="button" mat-icon-button (click)="hidePassword = !hidePassword">
            <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </mat-form-field>
        <!-- confirm password  -->

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Confirm Password</mat-label>
          <input
            matInput
            formControlName="confirmPassword"
            autocomplete="new-password"
            [type]="hidePassword ? 'password' : 'text'"
          />
          <mat-icon matPrefix>lock</mat-icon>
          <button matSuffix type="button" mat-icon-button (click)="hidePassword = !hidePassword">
            <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </mat-form-field>
        <mat-error
          *ngIf="
            signupForm.errors?.['passwordMismatch'] && signupForm.get('confirmPassword')?.touched
          "
        >
          Passwords do not match
        </mat-error>
        <button
          type="submit"
          mat-raised-button
          color="primary"
          class="full-width"
          [disabled]="signupForm.invalid"
        >
          {{ isLoading ? 'Signing Up...' : 'Sign Up' }}
        </button>
      </form>
    </mat-card>
  </div>
</div>
