<div class="signup-background">
  <div class="signUp-container">
    <mat-card class="signup-card">
      <h1 class="title">sign up</h1>
      <form [formGroup]="signUpForm" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Full Name</mat-label>
          <input matInput formControlName="fullName" />
          <mat-icon matPrefix>name</mat-icon>
        </mat-form-field>
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input matInput formControlName="fullName" />
          <mat-icon matPrefix>email</mat-icon>
        </mat-form-field>
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Password</mat-label>
          <input matInput formControlName="fullName" [type]="hidePassword ? 'password' : 'text'" />
          <mat-icon matPrefix>lock</mat-icon>

          <button matSuffix type="button" mat-icon-button (click)="hidePassword = !hidePassword">
            <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </mat-form-field>
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Confirm Password</mat-label>
          <input matInput formControlName="fullName" [type]="hidePassword ? 'password' : 'text'" />
          <mat-icon matPrefix>lock</mat-icon>
          <button matSuffix type="button" mat-icon-button (click)="hidePassword = !hidePassword">
            <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </mat-form-field>

        <button type="submit" mat-raised-button color="primary" class="full-width">Sign Up</button>
      </form>
    </mat-card>
  </div>
</div>
