<!-- [ ]  → Property Binding (TS → HTML)
( )  → Event Binding (HTML → TS) -->
<div class="container d-flex justify-content-center align-items-center py-5">
  <div class="card shadow-lg p-4 login-card">
    <!-- Title -->
    <div class="text-center mb-3">
      <h2 class="fw-bold text-primary">Welcome Back</h2>
      <p class="text-muted">Login to continue your learning journey</p>
    </div>

    <!-- Backend Error -->
    <div *ngIf="errorMessage" class="alert alert-danger text-center py-2">
      {{ errorMessage }}
    </div>

    <!-- Login Form -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <!-- Email -->
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input
          type="email"
          class="form-control form-control-lg"
          placeholder="Enter your email"
          formControlName="email"
        />
        <small class="text-danger" *ngIf="f['email'].touched && f['email'].errors?.['required']">
          Email is required
        </small>
      </div>

      <!-- Password -->
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input
          type="password"
          class="form-control form-control-lg"
          placeholder="Enter your password"
          formControlName="password"
        />
        <small
          class="text-danger"
          *ngIf="f['password'].touched && f['password'].errors?.['required']"
        >
          Password is required
        </small>
      </div>

      <!-- Button -->
      <button
        type="submit"
        class="btn btn-primary btn-lg w-100 mt-3"
        [disabled]="loginForm.invalid"
      >
        Login
      </button>
    </form>

    <!-- Signup -->
    <div class="text-center mt-3">
      <span class="text-muted">Don’t have an account?</span>
      <a routerLink="/signup" class="fw-semibold text-primary ms-1">SignUp</a>
    </div>
  </div>
</div>
