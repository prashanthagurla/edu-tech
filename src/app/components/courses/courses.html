<div class="container my-5">
  <h2 class="text-center mb-4">Our Courses</h2>

  <div class="row g-4">
    <div class="col-lg-4 col-md-6" *ngFor="let course of isPreview ? courses.slice(0, 3) : courses">
      <div class="card h-100 shadow-sm">
        <!-- Course Image -->
        <img
          [src]="course.image"
          class="card-img-top p-3"
          alt="{{ course.title }}"
          style="height: 160px; object-fit: contain"
        />

        <div class="card-body d-flex flex-column">
          <!-- Title -->
          <h5 class="card-title">{{ course.title }}</h5>

          <!-- Description -->
          <p class="card-text text-muted small">
            {{ course.description }}
          </p>

          <!-- Spacer pushes footer down -->
          <div class="mt-auto">
            <!-- Duration + Price -->
            <div class="d-flex justify-content-between align-items-center mb-3">
              <span class="badge bg-info text-dark"> ⏱ {{ course.duration }} </span>

              <span class="fw-bold text-primary"> ₹{{ course.price }} </span>
            </div>

            <!-- Action Button -->
            <button class="btn btn-primary w-100">View Details</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
