<h2>Student List</h2>
<table class="table table-striped">
  <thead>
    <tr>
      <th>S/N</th>
      <th>Roll No</th>
      <th>First Name</th>
      <th>Last Name</th>
      <th>Email</th>
      <th>Actions</th>
      <th>Delete Student</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let student of students$ | async">
      <td>{{ student.id }}</td>
      <td>{{ student.rollNo }}</td>
      <td>{{ student.firstName }}</td>
      <td>{{ student.lastName }}</td>
      <td>{{ student.email }}</td>
      <td>
        <button (click)="updateStudent(student.id)" class="btn btn-info">update</button>
      </td>
      <td>
        <button (click)="deleteStudent(student.id)" class="btn btn-danger">Delete</button>
      </td>
    </tr>
  </tbody>
</table>
