<div class="col-md-6 offset-md-3">
  <h3>Update Student</h3>
  <form (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="">First Name</label>
      <input type="text" class="form-control" [(ngModel)]="student.firstName" name="firstName" />
    </div>
    <div class="form-group">
      <label for="">Last Name</label>
      <input type="text" class="form-control" [(ngModel)]="student.lastName" name="lastName" />
    </div>
    <div class="form-group">
      <label for="">Email</label>
      <input type="text" class="form-control" [(ngModel)]="student.email" name="emailId" />
    </div>
    <button type="submit" class="btn btn-success mt-3">Update Student</button>
  </form>
</div>
