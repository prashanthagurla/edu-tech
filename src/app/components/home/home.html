<div class="container-fluid bg-light py-5">
  <div class="container">
    <div class="row align-items-center">
      <!-- Left Side Content -->
      <div class="col-md-6 text-center text-md-start">
        <h1 class="display-5 fw-bold text-dark">
          Learn Skills.<br />
          Build Your Career.<br />
          <span class="text-primary">Upskill with Confidence</span>
        </h1>

        <p class="lead text-secondary mt-4">
          Upskill Edutech helps you learn industry-ready skills with practical courses, real-world
          projects, and expert mentorship.
        </p>

        <div class="mt-4">
          <button class="btn btn-primary btn-lg me-3">Get Started</button>
          <button routerLink="/courses" class="btn btn-outline-primary btn-lg">
            Explore Courses
          </button>
        </div>
      </div>

      <!-- Right Side Image -->
      <div class="col-md-6 text-center mt-5 mt-md-0">
        <img
          src="https://img.freepik.com/free-vector/online-learning-concept-illustration_114360-4765.jpg"
          alt="Online Learning"
          class="img-fluid"
        />
      </div>
    </div>
  </div>
</div>
<!-- COURSES PREVIEW SECTION (ON SCROLL) -->
<app-courses [isPreview]="isPreviewOnHome"></app-courses>
